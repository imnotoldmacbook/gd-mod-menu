name: Build GD Mod Menu

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # Manual trigger

jobs:
  build:
    runs-on: windows-2022
    name: Build 32-bit DLL (Windows)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild / Visual Studio
        uses: microsoft/setup-msbuild@v2

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v1
        with:
          cmake-version: '3.30'

      - name: Configure (Visual Studio 2022, 32-bit)
        run: |
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A Win32 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build
          cmake --build . --config Release

      - name: Verify DLL
        run: |
          ls -la build/Release/gd-mod-menu.dll
          file build/Release/gd-mod-menu.dll

      - name: Upload DLL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gd-mod-menu.dll
          path: build/Release/gd-mod-menu.dll
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build/Release/gd-mod-menu.dll
          generate_release_notes: true